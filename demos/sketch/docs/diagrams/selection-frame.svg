<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-label="The selection frame and how a resize is applied">
<title>The selection frame and how a resize is applied</title>
<desc>Oriented box, handles, rotate knob and transform origin.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="26" class="h c" >Selection frame (SelectionFrame, CanvasView handles)</text>
<path d="M94.38 196.66 L301.04 121.22 L345.62 243.34 L138.96 318.78 Z" fill="#e8f0fc" stroke="#1e6fe0" stroke-width="1.5"/>
<rect x="90.38" y="192.66" width="8" height="8" rx="0" class="box" />
<text x="86.38" y="188.66" class="s e" >0</text>
<rect x="193.71" y="154.94" width="8" height="8" rx="0" class="box" />
<text x="189.71" y="150.94" class="s" >1</text>
<rect x="297.04" y="117.22" width="8" height="8" rx="0" class="box" />
<text x="309.04" y="113.22" class="s" >2</text>
<rect x="319.33" y="178.28" width="8" height="8" rx="0" class="box" />
<text x="331.33" y="198.28" class="s" >3</text>
<rect x="341.62" y="239.34" width="8" height="8" rx="0" class="box" />
<text x="353.62" y="259.34" class="s" >4</text>
<rect x="238.29" y="277.06" width="8" height="8" rx="0" class="box" />
<text x="234.29" y="297.06" class="s" >5</text>
<rect x="134.96" y="314.78" width="8" height="8" rx="0" class="box" />
<text x="130.96" y="334.78" class="s e" >6</text>
<rect x="112.67" y="253.72" width="8" height="8" rx="0" class="box" />
<text x="108.67" y="273.72" class="s e" >7</text>
<line x1="197.71" y1="158.94" x2="190.17" y2="138.27" class="acc" />
<circle cx="190.17" cy="138.27" r="5" class="box" />
<text x="200.17" y="134.27" class="s" >8  rotate knob</text>
<circle cx="220" cy="220" r="5" class="box" />
<line x1="212" y1="220" x2="228" y2="220" class="thin" />
<line x1="220" y1="212" x2="220" y2="228" class="thin" />
<text x="230" y="224" class="s" >9</text>
<text x="70" y="362" class="s" >9 = transform origin: the pivot of rotate and shear and of the</text>
<text x="70" y="375" class="s" >Rotate / Scale / Reflect tools (a click with those tools moves it)</text>
<text x="70" y="400" class="s" >frame.angle = the shared frameAngle of the selection (one object: its own;</text>
<text x="70" y="413" class="s" >several: their common angle, else the group angle set while rotating)</text>
<rect x="470" y="50" width="450" height="380" rx="6" class="panel" />
<text x="485" y="74" class="t b" >Applying a drag (updateDrag -&gt; applyToSelection)</text>
<text x="485" y="98" class="s" >1. press: dragBefore_ = snapshotSelection() (outlines, text matrices, angles)</text>
<text x="485" y="113" class="s" >   and dragFrame_ = selectionFrame()</text>
<text x="485" y="128" class="s" >2. every move: put the outlines back to dragBefore_, transform by M, setFrameAngle</text>
<text x="485" y="143" class="s" >   (no accumulation of error; the preview is cheap and exact)</text>
<text x="485" y="158" class="s" >3. release: commitGeometry(before, name, frameBefore) = ONE undo step</text>
<text x="485" y="192" class="t b" >Resize in the frame's own axes:</text>
<text x="485" y="212" class="m" >M = R(a) * Scale(sx, sy) about the anchor * R(-a)</text>
<text x="485" y="236" class="s" >anchor = the opposite handle (Alt: the centre); sx, sy from the</text>
<text x="485" y="251" class="s" >mouse in frame-local coordinates; Shift keeps proportions;</text>
<text x="485" y="266" class="s" >an upright frame also snaps its moving edges (grid, guides,</text>
<text x="485" y="281" class="s" >other objects).</text>
<text x="485" y="312" class="t b" >Other drags use the same loop:</text>
<text x="485" y="332" class="s" >Rotate (knob): angle from the origin, Shift = 15 deg steps</text>
<text x="485" y="347" class="s" >Shear (Alt+Shift on a middle handle), Warp (Alt+Shift corner):</text>
<text x="485" y="362" class="s" >projective map from the old quad to the new quad (QuadFrame)</text>
<text x="485" y="377" class="s" >Rotate / Scale / Reflect tools: matrix about the origin,</text>
<text x="485" y="392" class="s" >Alt at release -&gt; duplicateTransformed instead</text>
</svg>
