<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="How a mouse gesture becomes an edit">
<title>How a mouse gesture becomes an edit</title>
<desc>Tool dispatch, live preview and one undo step.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="480" y="26" class="h c" >CanvasView gesture handling (canvasview.cpp and the tool files)</text>
<rect x="20" y="50" width="215" height="110" rx="6" class="box" />
<text x="127.5" y="84" class="t b c" >handleMouseDown</text>
<text x="127.5" y="99" class="s c" >pan? ruler guide?</text>
<text x="127.5" y="111" class="s c" >then by tool_:</text>
<text x="127.5" y="123" class="s c" >record dragStart,</text>
<text x="127.5" y="135" class="s c" >set drag_ (Drag enum)</text>
<rect x="255" y="50" width="215" height="110" rx="6" class="soft" />
<text x="362.5" y="78" class="t b c" >updateDrag (moves)</text>
<text x="362.5" y="93" class="s c" >the live preview:</text>
<text x="362.5" y="105" class="s c" >restore dragBefore_,</text>
<text x="362.5" y="117" class="s c" >apply the new matrix /</text>
<text x="362.5" y="129" class="s c" >shape; snapping;</text>
<text x="362.5" y="141" class="s c" >markDirty()</text>
<line x1="235" y1="105" x2="255" y2="105" class="line" marker-end="url(#arrow)"/>
<rect x="490" y="50" width="215" height="110" rx="6" class="box" />
<text x="597.5" y="78" class="t b c" >finishDrag (up)</text>
<text x="597.5" y="93" class="s c" >updateDrag once more,</text>
<text x="597.5" y="105" class="s c" >then by the drag kind:</text>
<text x="597.5" y="117" class="s c" >commitGeometry /</text>
<text x="597.5" y="129" class="s c" >addDrawn / replaceUndoable</text>
<text x="597.5" y="141" class="s c" >= ONE undo step</text>
<line x1="470" y1="105" x2="490" y2="105" class="line" marker-end="url(#arrow)"/>
<rect x="725" y="50" width="215" height="110" rx="6" class="box" />
<text x="832.5" y="90" class="t b c" >paintOverlay</text>
<text x="832.5" y="105" class="s c" >frames, handles, guides,</text>
<text x="832.5" y="117" class="s c" >tool previews (never</text>
<text x="832.5" y="129" class="s c" >part of the document)</text>
<line x1="705" y1="105" x2="725" y2="105" class="line" marker-end="url(#arrow)"/>
<text x="480" y="182" class="s c" >Esc during a drag restores the outlines and drops the gesture (nothing is pushed).</text>
<rect x="20" y="200" width="920" height="260" rx="6" class="panel" />
<text x="34" y="222" class="t b" >Tools and what they push when the gesture ends</text>
<text x="34" y="246" class="t b" >Select / handles</text>
<text x="250" y="246" class="s" >Move, Resize, Rotate, Shear, Warp, Origin</text>
<text x="560" y="246" class="s" >commitGeometry (+ noteTransform for Transform Again)</text>
<text x="34" y="269" class="t b" >Rotate / Scale / Reflect</text>
<text x="250" y="269" class="s" >TransformTool about the transform origin</text>
<text x="560" y="269" class="s" >commitGeometry, or duplicateTransformed with Alt</text>
<text x="34" y="292" class="t b" >shapes, Line</text>
<text x="250" y="292" class="s" >Draw (rubber band, snapPoint)</text>
<text x="560" y="292" class="s" >addDrawn -&gt; addUndoable</text>
<text x="34" y="315" class="t b" >Pen, Pencil, Paintbrush</text>
<text x="250" y="315" class="s" >PenHandle / Pencil</text>
<text x="560" y="315" class="s" >finishPen / finishPencil -&gt; addDrawn (fitCurve)</text>
<text x="34" y="338" class="t b" >Direct Select</text>
<text x="250" y="338" class="s" >DirectEdit (anchor or handle of SubPath)</text>
<text x="560" y="338" class="s" >replaces the outline from subPathsToPath</text>
<text x="34" y="361" class="t b" >Scissors, Knife, Eraser, Shape Builder</text>
<text x="250" y="361" class="s" >cuts via pathops</text>
<text x="560" y="361" class="s" >replaceUndoable (remove + add objects)</text>
<text x="34" y="384" class="t b" >Gradient, Width</text>
<text x="250" y="384" class="s" >GradientNew/End/Stop, Width</text>
<text x="560" y="384" class="s" >commitStyle / StrokeOptions edits</text>
<text x="34" y="407" class="t b" >Artboard</text>
<text x="250" y="407" class="s" >ArtboardNew/Move/Resize (live rect)</text>
<text x="560" y="407" class="s" >setArtboard / addArtboard (release only)</text>
<text x="34" y="430" class="t b" >Lasso, Magic Wand, marquee</text>
<text x="250" y="430" class="s" >selection only</text>
<text x="560" y="430" class="s" >no undo step (selection is a view)</text>
</svg>
