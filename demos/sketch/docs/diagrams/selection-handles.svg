<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-label="Selection handles">
<title>Selection handles</title>
<desc>What dragging each part of the selection frame does.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="470" y="26" class="h c" >Selection frame</text>
<rect x="130" y="170" width="260" height="150" fill="#e8f0fc" stroke="#1e6fe0" stroke-width="1.5"/>
<rect x="126" y="166" width="8" height="8" rx="0" class="box" />
<rect x="256" y="166" width="8" height="8" rx="0" class="box" />
<rect x="386" y="166" width="8" height="8" rx="0" class="box" />
<rect x="386" y="241" width="8" height="8" rx="0" class="box" />
<rect x="386" y="316" width="8" height="8" rx="0" class="box" />
<rect x="256" y="316" width="8" height="8" rx="0" class="box" />
<rect x="126" y="316" width="8" height="8" rx="0" class="box" />
<rect x="126" y="241" width="8" height="8" rx="0" class="box" />
<line x1="260" y1="170" x2="260" y2="144" class="acc" />
<circle cx="260" cy="144" r="5" class="box" />
<circle cx="260" cy="245" r="5" class="box" />
<line x1="252" y1="245" x2="268" y2="245" class="thin" />
<line x1="260" y1="237" x2="260" y2="253" class="thin" />
<text x="260" y="279" class="s c" >drag inside = move</text>
<circle cx="106" cy="150" r="9.5" fill="#d4380d"/><text x="106" y="154" class="c b" style="fill:#fff;font-size:11px">1</text>
<circle cx="300" cy="162" r="9.5" fill="#d4380d"/><text x="300" y="166" class="c b" style="fill:#fff;font-size:11px">2</text>
<circle cx="280" cy="136" r="9.5" fill="#d4380d"/><text x="280" y="140" class="c b" style="fill:#fff;font-size:11px">3</text>
<circle cx="238" cy="231" r="9.5" fill="#d4380d"/><text x="238" y="235" class="c b" style="fill:#fff;font-size:11px">4</text>
<circle cx="416" cy="245" r="9.5" fill="#d4380d"/><text x="416" y="249" class="c b" style="fill:#fff;font-size:11px">5</text>
<circle cx="510" cy="80" r="9.5" fill="#d4380d"/><text x="510" y="84" class="c b" style="fill:#fff;font-size:11px">1</text>
<text x="526" y="84" class="t" >Corner handle: resize; Shift keeps proportions</text>
<circle cx="510" cy="110" r="9.5" fill="#d4380d"/><text x="510" y="114" class="c b" style="fill:#fff;font-size:11px">2</text>
<text x="526" y="114" class="t" >Edge handle: resize one side</text>
<circle cx="510" cy="140" r="9.5" fill="#d4380d"/><text x="510" y="144" class="c b" style="fill:#fff;font-size:11px">3</text>
<text x="526" y="144" class="t" >Rotate knob: turn; Shift = 15 degree steps</text>
<circle cx="510" cy="170" r="9.5" fill="#d4380d"/><text x="510" y="174" class="c b" style="fill:#fff;font-size:11px">4</text>
<text x="526" y="174" class="t" >Origin: the pivot for rotating and for the Rotate / Scale / Reflect tools - drag to move it</text>
<circle cx="510" cy="200" r="9.5" fill="#d4380d"/><text x="510" y="204" class="c b" style="fill:#fff;font-size:11px">5</text>
<text x="526" y="204" class="t" >Alt while resizing: from the center</text>
<text x="500" y="280" class="t b" >Modifier keys while dragging</text>
<rect x="500" y="292" width="90" height="20" rx="3" class="box" />
<text x="545" y="306" class="s b c" >Shift</text>
<text x="600" y="306" class="s" >move: along one axis; resize: keep proportions; rotate: 15 degree steps</text>
<rect x="500" y="318" width="90" height="20" rx="3" class="box" />
<text x="545" y="332" class="s b c" >Alt</text>
<text x="600" y="332" class="s" >resize: from the center; at release of a Rotate / Scale / Reflect: make a copy</text>
<rect x="500" y="344" width="90" height="20" rx="3" class="box" />
<text x="545" y="358" class="s b c" >Alt + Shift</text>
<text x="600" y="358" class="s" >on an edge handle: shear; on a corner: perspective warp</text>
<rect x="500" y="370" width="90" height="20" rx="3" class="box" />
<text x="545" y="384" class="s b c" >Ctrl + click</text>
<text x="600" y="384" class="s" >pick one object out of a group</text>
<rect x="500" y="396" width="90" height="20" rx="3" class="box" />
<text x="545" y="410" class="s b c" >Arrow keys</text>
<text x="600" y="410" class="s" >nudge 1 pt (Shift: 10 pt)</text>
<rect x="500" y="422" width="90" height="20" rx="3" class="box" />
<text x="545" y="436" class="s b c" >Esc</text>
<text x="600" y="436" class="s" >cancel the drag; with nothing dragging, deselect</text>
</svg>
