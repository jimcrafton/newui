<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="A first drawing in six steps">
<title>A first drawing in six steps</title>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500" y="24" class="h c" >A first drawing</text>
<rect x="20" y="46" width="320" height="126" rx="6" class="panel" />
<circle cx="40" cy="70" r="9.5" fill="#d4380d"/><text x="40" y="74" class="c b" style="fill:#fff;font-size:11px">1</text>
<g transform="translate(58 56) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffffff" stroke-width="3.5"><rect x="3" y="6" width="18" height="12" rx="1" fill="#ffffff" stroke="#ffffff"/></g><rect x="3" y="6" width="18" height="12" rx="1" fill="#3a3a3a" stroke="none"/></g>
<text x="96" y="76" class="h" >Draw</text>
<text x="36" y="108" class="s" >Pick the Rectangle or Star tool in the palette </text>
<text x="36" y="124" class="s" >and drag on the page. </text>
<rect x="350" y="46" width="320" height="126" rx="6" class="panel" />
<circle cx="370" cy="70" r="9.5" fill="#d4380d"/><text x="370" y="74" class="c b" style="fill:#fff;font-size:11px">2</text>
<g transform="translate(388 56) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffffff" stroke-width="3.5"><rect x="4" y="4" width="16" height="16" fill="#ffffff"/></g><rect x="4" y="4" width="16" height="16" fill="#3a3a3a"/></g>
<text x="426" y="76" class="h" >Color</text>
<text x="366" y="108" class="s" >Click a swatch in the Color panel (the Fill / </text>
<text x="366" y="124" class="s" >Stroke target is at its top). </text>
<rect x="680" y="46" width="320" height="126" rx="6" class="panel" />
<circle cx="700" cy="70" r="9.5" fill="#d4380d"/><text x="700" y="74" class="c b" style="fill:#fff;font-size:11px">3</text>
<g transform="translate(718 56) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffffff" stroke-width="3.5"><path d="M6 3v17l4.2-3.9 2.9 6.1 2.6-1.2-2.9-6H19z" fill="#ffffff" stroke="#ffffff"/></g><path d="M6 3v17l4.2-3.9 2.9 6.1 2.6-1.2-2.9-6H19z" fill="#3a3a3a" stroke="none"/></g>
<text x="756" y="76" class="h" >Edit</text>
<text x="696" y="108" class="s" >Select tool: click the shape, drag its </text>
<text x="696" y="124" class="s" >handles; Direct Select edits points. </text>
<rect x="20" y="186" width="320" height="126" rx="6" class="panel" />
<circle cx="40" cy="210" r="9.5" fill="#d4380d"/><text x="40" y="214" class="c b" style="fill:#fff;font-size:11px">4</text>
<g transform="translate(58 196) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/><path d="M12 7.2A6 6 0 0 1 12 16.8 6 6 0 0 1 12 7.2z" fill="#3a3a3a" stroke="none"/></g>
<text x="96" y="216" class="h" >Combine</text>
<text x="36" y="248" class="s" >Draw more, then Object &gt; Pathfinder or the </text>
<text x="36" y="264" class="s" >Shape Builder. </text>
<rect x="350" y="186" width="320" height="126" rx="6" class="panel" />
<circle cx="370" cy="210" r="9.5" fill="#d4380d"/><text x="370" y="214" class="c b" style="fill:#fff;font-size:11px">5</text>
<g transform="translate(388 196) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffffff" stroke-width="3.5"><rect x="3" y="3" width="10" height="10"/><rect x="11" y="11" width="10" height="10"/></g><rect x="3" y="3" width="10" height="10" stroke-dasharray="2 2"/><rect x="11" y="11" width="10" height="10"/></g>
<text x="426" y="216" class="h" >Organize</text>
<text x="366" y="248" class="s" >Group (Ctrl+G), arrange with Arrange / Layers, </text>
<text x="366" y="264" class="s" >align with the toolbar. </text>
<rect x="680" y="186" width="320" height="126" rx="6" class="panel" />
<circle cx="700" cy="210" r="9.5" fill="#d4380d"/><text x="700" y="214" class="c b" style="fill:#fff;font-size:11px">6</text>
<g transform="translate(718 196) scale(1.27) translate(-1 -1)" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><g stroke="#ffffff" stroke-width="3.5"><path d="M5 4h12l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></g><path d="M5 4h12l3 3v13H5z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></g>
<text x="756" y="216" class="h" >Save / export</text>
<text x="696" y="248" class="s" >File &gt; Save (.svg or .skb); File &gt; Export As </text>
<text x="696" y="264" class="s" >Image for a PNG. </text>
<text x="500" y="336" class="s c" >Ctrl+Z / Ctrl+Y undo and redo every step; Esc cancels a drag or deselects.</text>
</svg>
