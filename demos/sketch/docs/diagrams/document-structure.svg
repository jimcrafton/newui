<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-label="Structure of a SketchDocument">
<title>Structure of a SketchDocument</title>
<desc>The document holds artboards, a layer tree, a flat back-to-front list of objects, and libraries.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500" y="26" class="h c" >SketchDocument</text>
<rect x="20" y="40" width="960" height="650" rx="8" class="panel" />
<rect x="40" y="60" width="250" height="120" rx="6" class="box" />
<text x="165" y="80" class="t b c" >artboards_ : vector&lt;Artboard&gt;</text>
<text x="54" y="100" class="s" >name, x, y, width, height</text>
<text x="54" y="115" class="s" >never empty; one is active</text>
<text x="54" y="130" class="s" >= "the page" (Align, trace, export)</text>
<rect x="40" y="196" width="250" height="168" rx="6" class="box" />
<text x="165" y="216" class="t b c" >layers_ : vector&lt;Layer&gt;</text>
<text x="54" y="236" class="s" >id, parent (0 = top level), name</text>
<text x="54" y="251" class="s" >visible, locked, expanded, color</text>
<text x="54" y="266" class="s" >siblings listed back to front</text>
<text x="54" y="281" class="s" >tree depth by parent chain</text>
<text x="54" y="296" class="s" >activeLayer_ = where new objects go</text>
<rect x="40" y="380" width="250" height="110" rx="6" class="box" />
<text x="165" y="400" class="t b c" >guides_, swatches_, graphicStyles_</text>
<text x="54" y="420" class="s" >Guide { vertical, position }</text>
<text x="54" y="435" class="s" >swatch = named color</text>
<text x="54" y="450" class="s" >GraphicStyle = appearance + opacity</text>
<rect x="40" y="506" width="250" height="164" rx="6" class="box" />
<text x="165" y="526" class="t b c" >groupProps_ : id -&gt; GroupProps</text>
<text x="54" y="546" class="s" >opacity, blend mode, clip flag</text>
<text x="54" y="561" class="s" >a group is only an id: members</text>
<text x="54" y="576" class="s" >list it in groups_ (outermost</text>
<text x="54" y="591" class="s" >first); members stay adjacent in</text>
<text x="54" y="606" class="s" >the stacking order</text>
<rect x="320" y="60" width="360" height="610" rx="8" class="soft" />
<text x="500" y="82" class="t b c" >objects_ : vector&lt;unique_ptr&lt;SketchObject&gt;&gt;</text>
<text x="500" y="98" class="s c" >flat, back (index 0) to front; sorted by layer after every change</text>
<rect x="344" y="112" width="312" height="32" rx="5" class="box" />
<text x="358" y="132" class="t" >Rect  (layer 1)</text>
<text x="644" y="132" class="s e" >#0</text>
<rect x="344" y="152" width="312" height="32" rx="5" class="box" />
<text x="358" y="172" class="t" >Path  (layer 1, group 4)</text>
<text x="644" y="172" class="s e" >#1</text>
<rect x="344" y="192" width="312" height="32" rx="5" class="box" />
<text x="358" y="212" class="t" >Text  (layer 1, group 4)</text>
<text x="644" y="212" class="s e" >#2</text>
<rect x="344" y="232" width="312" height="32" rx="5" class="box" />
<text x="358" y="252" class="t" >Image (layer 2)</text>
<text x="644" y="252" class="s e" >#3</text>
<rect x="344" y="272" width="312" height="32" rx="5" class="box" />
<text x="358" y="292" class="t" >Symbol (layer 2)</text>
<text x="644" y="292" class="s e" >#4</text>
<rect x="344" y="312" width="312" height="32" rx="5" class="box" />
<text x="358" y="332" class="t" >Ellipse (layer 3)</text>
<text x="644" y="332" class="s e" >#5</text>
<line x1="500" y1="352" x2="500" y2="372" class="line" marker-end="url(#arrow)"/>
<rect x="340" y="380" width="320" height="276" rx="6" class="box" />
<text x="500" y="400" class="t b c" >SketchObject</text>
<text x="354" y="420" class="s" >type_   Line Rect RoundRect Ellipse Polygon Polyline</text>
<text x="354" y="435.5" class="s" >        Path Text Symbol Image</text>
<text x="354" y="451" class="s" >path_   BLPath in document points, y down</text>
<text x="354" y="466.5" class="s" >items_  appearance: fills, strokes, effects</text>
<text x="354" y="482" class="s" >opacity_, blendMode_, groups_, layer_</text>
<text x="354" y="497.5" class="s" >visible_/locked_  (+ layer state, kept by doc)</text>
<text x="354" y="513" class="s" >frameAngle_  (the box the handles use)</text>
<text x="354" y="528.5" class="s" >text: text_ font size style textMatrix_ warp</text>
<text x="354" y="544" class="s" >symbol_ -&gt; SymbolDef,  image_ -&gt; ImageData</text>
<text x="354" y="559.5" class="s" >id (unique, stable across undo)</text>
<rect x="710" y="60" width="250" height="610" rx="6" class="box" />
<text x="835" y="80" class="t b c" >libraries (shared, immutable)</text>
<rect x="724" y="98" width="222" height="112" rx="6" class="soft" />
<text x="835" y="118" class="t b c" >symbols_</text>
<text x="738" y="138" class="s" >SymbolDef: id, name, box,</text>
<text x="738" y="153" class="s" >content = a small SketchDocument</text>
<text x="738" y="168" class="s" >-&gt; Symbol objects (instances)</text>
<rect x="724" y="222" width="222" height="112" rx="6" class="soft" />
<text x="835" y="242" class="t b c" >patterns_</text>
<text x="738" y="262" class="s" >SymbolDef used as a tile</text>
<text x="738" y="277" class="s" >-&gt; SketchPaint::Pattern</text>
<text x="738" y="292" class="s" >(id, scale, angle)</text>
<rect x="724" y="346" width="222" height="112" rx="6" class="soft" />
<text x="835" y="366" class="t b c" >brushes_</text>
<text x="738" y="386" class="s" >BrushDef: kind + numbers</text>
<text x="738" y="401" class="s" >(+ artwork SymbolDef)</text>
<text x="738" y="416" class="s" >-&gt; StrokeOptions::brush</text>
<rect x="724" y="470" width="222" height="112" rx="6" class="soft" />
<text x="835" y="490" class="t b c" >images</text>
<text x="738" y="510" class="s" >ImageData: file bytes + pixels</text>
<text x="738" y="525" class="s" >no library list: the Image objects</text>
<text x="738" y="540" class="s" >share the pointer; saved once</text>
<line x1="290" y1="120" x2="320" y2="120" class="thin" />
<line x1="290" y1="280" x2="320" y2="280" class="thin" />
<line x1="680" y1="200" x2="710" y2="200" class="thin" />
</svg>
