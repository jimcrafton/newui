<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="What a clipping mask does and does not do">
<title>What a clipping mask does and does not do</title>
<desc>The mask's own paint is ignored, edges are hard, holes cut holes, and masks can be nested.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker><clipPath id="r1"><rect x="40" y="85" width="175" height="95" rx="30"/></clipPath><clipPath id="box3"><rect x="30" y="70" width="195" height="125"/></clipPath><clipPath id="box4"><rect x="270" y="70" width="185" height="125"/></clipPath><clipPath id="r2"><circle cx="362" cy="132" r="48"/></clipPath><clipPath id="box6"><rect x="270" y="70" width="185" height="125"/></clipPath><clipPath id="r3"><path clip-rule="evenodd" d="M547 132 a50 50 0 1 0 100 0 a50 50 0 1 0 -100 0 Z M573 132 a24 24 0 1 0 48 0 a24 24 0 1 0 -48 0 Z"/></clipPath><linearGradient id="skyR3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9ee"/><stop offset="1" stop-color="#cfe9fb"/></linearGradient><clipPath id="r4a"><rect x="800" y="80" width="105" height="105" rx="10"/></clipPath><clipPath id="r4b"><ellipse cx="832" cy="132" rx="64" ry="48"/></clipPath><clipPath id="box11"><rect x="760" y="70" width="160" height="125"/></clipPath></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="215" height="292" rx="8" class="panel" />
<text x="34" y="44" class="h" >Its own look is dropped</text>
<text x="34" y="228" class="t" >Fill, stroke and effects of the</text>
<text x="34" y="243" class="t" >mask shape are not drawn. Only</text>
<text x="34" y="258" class="t" >its outline counts.</text>
<rect x="255" y="20" width="215" height="292" rx="8" class="panel" />
<text x="269" y="44" class="h" >Hard edges</text>
<text x="269" y="228" class="t" >Inside is fully shown, outside</text>
<text x="269" y="243" class="t" >is fully hidden. For a soft</text>
<text x="269" y="258" class="t" >edge, blur or fade the artwork</text>
<text x="269" y="273" class="t" >itself instead.</text>
<rect x="490" y="20" width="215" height="292" rx="8" class="panel" />
<text x="504" y="44" class="h" >A hole stays a hole</text>
<text x="504" y="228" class="t" >A mask with a hole (a ring made</text>
<text x="504" y="243" class="t" >with Pathfinder &gt; Minus Front)</text>
<text x="504" y="258" class="t" >shows the artwork only in the</text>
<text x="504" y="273" class="t" >ring.</text>
<rect x="725" y="20" width="215" height="292" rx="8" class="panel" />
<text x="739" y="44" class="h" >Masks inside masks</text>
<text x="739" y="228" class="t" >Select a masked group and</text>
<text x="739" y="243" class="t" >another shape on top, and Make</text>
<text x="739" y="258" class="t" >again: both cuts apply.</text>
<g clip-path="url(#box3)"><g clip-path="url(#r1)"><rect x="30" y="70" width="14" height="125" fill="#e8472b"/><rect x="44" y="70" width="14" height="125" fill="#f2b824"/><rect x="58" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="72" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="86" y="70" width="14" height="125" fill="#e8472b"/><rect x="100" y="70" width="14" height="125" fill="#f2b824"/><rect x="114" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="128" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="142" y="70" width="14" height="125" fill="#e8472b"/><rect x="156" y="70" width="14" height="125" fill="#f2b824"/><rect x="170" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="184" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="198" y="70" width="14" height="125" fill="#e8472b"/><rect x="212" y="70" width="14" height="125" fill="#f2b824"/><rect x="226" y="70" width="14" height="125" fill="#1e6fe0"/></g></g>
<text x="127" y="205" class="s c" >mask had a red fill and a thick stroke</text>
<g opacity="0.16">
<g clip-path="url(#box4)"><g><rect x="270" y="70" width="14" height="125" fill="#e8472b"/><rect x="284" y="70" width="14" height="125" fill="#f2b824"/><rect x="298" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="312" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="326" y="70" width="14" height="125" fill="#e8472b"/><rect x="340" y="70" width="14" height="125" fill="#f2b824"/><rect x="354" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="368" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="382" y="70" width="14" height="125" fill="#e8472b"/><rect x="396" y="70" width="14" height="125" fill="#f2b824"/><rect x="410" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="424" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="438" y="70" width="14" height="125" fill="#e8472b"/><rect x="452" y="70" width="14" height="125" fill="#f2b824"/><rect x="466" y="70" width="14" height="125" fill="#1e6fe0"/></g></g>
</g>
<g clip-path="url(#box6)"><g clip-path="url(#r2)"><rect x="270" y="70" width="14" height="125" fill="#e8472b"/><rect x="284" y="70" width="14" height="125" fill="#f2b824"/><rect x="298" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="312" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="326" y="70" width="14" height="125" fill="#e8472b"/><rect x="340" y="70" width="14" height="125" fill="#f2b824"/><rect x="354" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="368" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="382" y="70" width="14" height="125" fill="#e8472b"/><rect x="396" y="70" width="14" height="125" fill="#f2b824"/><rect x="410" y="70" width="14" height="125" fill="#1e6fe0"/><rect x="424" y="70" width="14" height="125" fill="#2f7d4f"/><rect x="438" y="70" width="14" height="125" fill="#e8472b"/><rect x="452" y="70" width="14" height="125" fill="#f2b824"/><rect x="466" y="70" width="14" height="125" fill="#1e6fe0"/></g></g>
<text x="362" y="205" class="s c" >(the grey part is hidden, not deleted)</text>
<g clip-path="url(#r3)"><rect x="505" y="70" width="185" height="125" fill="url(#skyR3)"/><circle cx="641.9" cy="103.75" r="15" fill="#ffd45e"/><path d="M505 160 Q542 122.5 588.25 155 T662.25 147.5 L690 195 L505 195 Z" fill="#3f8f5a"/><path d="M560.5 195 Q606.75 152.5 653 175 T690 170 L690 195 L560.5 195 Z" fill="#2b6b43"/></g>
<text x="597" y="205" class="s c" >(the middle is empty)</text>
<g clip-path="url(#r4a)"><g clip-path="url(#r4b)">
<g clip-path="url(#box11)"><g><rect x="760" y="70" width="12" height="125" fill="#e8472b"/><rect x="772" y="70" width="12" height="125" fill="#f2b824"/><rect x="784" y="70" width="12" height="125" fill="#1e6fe0"/><rect x="796" y="70" width="12" height="125" fill="#2f7d4f"/><rect x="808" y="70" width="12" height="125" fill="#e8472b"/><rect x="820" y="70" width="12" height="125" fill="#f2b824"/><rect x="832" y="70" width="12" height="125" fill="#1e6fe0"/><rect x="844" y="70" width="12" height="125" fill="#2f7d4f"/><rect x="856" y="70" width="12" height="125" fill="#e8472b"/><rect x="868" y="70" width="12" height="125" fill="#f2b824"/><rect x="880" y="70" width="12" height="125" fill="#1e6fe0"/><rect x="892" y="70" width="12" height="125" fill="#2f7d4f"/><rect x="904" y="70" width="12" height="125" fill="#e8472b"/><rect x="916" y="70" width="12" height="125" fill="#f2b824"/><rect x="928" y="70" width="12" height="125" fill="#1e6fe0"/></g></g>
</g></g>
