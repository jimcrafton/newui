<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The appearance stack of an object">
<title>The appearance stack of an object</title>
<desc>Items are painted bottom to top; effects act on everything below them.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="26" class="h c" >items_  (vector&lt;AppearanceItem&gt;) - painted bottom to top</text>
<rect x="40" y="284" width="520" height="46" rx="6" fill="#e8f0fc" stroke="#9a9a9a"/>
<text x="56" y="304" class="t b" >Fill   gradient</text>
<text x="56" y="320" class="s" >paint, opacity, blend, visible</text>
<text x="580" y="312" class="s" >drawItem: fill_path(shown)</text>
<rect x="40" y="228" width="520" height="46" rx="6" fill="#e8f0fc" stroke="#9a9a9a"/>
<text x="56" y="248" class="t b" >Stroke  4 pt</text>
<text x="56" y="264" class="s" >paint, width, StrokeOptions (cap, join, miter, dashes, width profile, brush)</text>
<text x="580" y="256" class="s" >drawItem: paintStrokeItem</text>
<rect x="40" y="172" width="520" height="46" rx="6" fill="#e8f0fc" stroke="#9a9a9a"/>
<text x="56" y="192" class="t b" >Fill   solid 30%  Multiply</text>
<text x="56" y="208" class="s" >a second fill on top</text>
<text x="580" y="200" class="s" >drawItem: fill_path</text>
<rect x="40" y="116" width="520" height="46" rx="6" fill="#fff3d6" stroke="#9a9a9a"/>
<text x="56" y="136" class="t b" >Round Corners  14</text>
<text x="56" y="152" class="s" >geometry effect: reshapes the outline of the items below</text>
<text x="580" y="144" class="s" >applied to `shown` path</text>
<rect x="40" y="60" width="520" height="46" rx="6" fill="#fde3e3" stroke="#9a9a9a"/>
<text x="56" y="80" class="t b" >Drop Shadow</text>
<text x="56" y="96" class="s" >pixel effect: needs the items below drawn into a layer first</text>
<text x="580" y="88" class="s" >paintWithEffects</text>
<text x="40" y="54" class="s" >top</text>
<text x="40" y="360" class="s" >bottom (painted first)</text>
<line x1="20" y1="330" x2="20" y2="70" class="line" marker-end="url(#arrow)"/>
<text x="660" y="340" class="s" >object-level: opacity_  blendMode_  (group props too)</text>
<text x="40" y="395" class="s" >Every object always has at least one fill and one stroke ("primary" items; either may be paint = none); the panels edit the active ones.</text>
</svg>
