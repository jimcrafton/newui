<text x="34" y="282" class="t b" >Using brushes</text>
<circle cx="48" cy="306" r="9.5" fill="#d4380d"/><text x="48" y="310" class="c b" style="fill:#fff;font-size:11px">1</text>
<text x="64" y="310" class="s" >Object &gt; Brush &gt; Add Brush Presets,</text>
<text x="64" y="325" class="s" >or make your own: select artwork,</text>
<text x="64" y="340" class="s" >then New Art / Scatter Brush</text>
<circle cx="283" cy="306" r="9.5" fill="#d4380d"/><text x="283" y="310" class="c b" style="fill:#fff;font-size:11px">2</text>
<text x="299" y="310" class="s" >Pick the brush in the Brushes panel;</text>
<text x="299" y="325" class="s" >its numbers appear (angle, roundness,</text>
<text x="299" y="340" class="s" >spacing ...) - edit and press Enter</text>
<circle cx="518" cy="306" r="9.5" fill="#d4380d"/><text x="518" y="310" class="c b" style="fill:#fff;font-size:11px">3</text>
<text x="534" y="310" class="s" >Select a stroked path and press Apply;</text>
<text x="534" y="325" class="s" >or choose the Paintbrush tool and</text>
<text x="534" y="340" class="s" >draw: it paints with the active brush</text>
<circle cx="753" cy="306" r="9.5" fill="#d4380d"/><text x="753" y="310" class="c b" style="fill:#fff;font-size:11px">4</text>
<text x="769" y="310" class="s" >Remove Brush returns to a plain stroke;</text>
<text x="769" y="325" class="s" >the stroke color is the nib color; art and</text>
<text x="769" y="340" class="s" >scatter keep the artwork's own colors</text>
<text x="34" y="400" class="s" >Editing a brush changes every stroke that uses it (one undo step). A brush that is in use cannot be deleted. Expand Appearance and Outline Stroke ignore the brush.</text>
<text x="34" y="418" class="s" >Brushes are saved with the file and travel with copied objects.</text>
</svg>
