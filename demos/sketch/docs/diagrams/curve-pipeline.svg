<text x="10" y="262" class="s" >gap = 1.5 / zoom: a sample is kept only when</text>
<text x="10" y="277" class="s" >the pointer moved that far (pencilPoints_)</text>
<text x="10" y="292" class="s" >a drag shorter than 4 screen px is a click</text>
<text x="325" y="262" class="s" >each pass: p'(i) = (p(i-1) + 2 p(i) + p(i+1)) / 4</text>
<text x="325" y="277" class="s" >the two ends stay put; takes the tremor out</text>
<text x="325" y="292" class="s" >so the fit follows the stroke, not the hand</text>
<text x="640" y="262" class="s" >fewest cubics within tolerance = 2.5 / zoom px</text>
<text x="640" y="277" class="s" >least-squares handles, Newton re-parametrisation,</text>
<text x="640" y="292" class="s" >split at the worst point; turns &gt; ~60 deg stay corners</text>
<rect x="10" y="330" width="940" height="50" rx="6" class="soft" />
<text x="480" y="351" class="t c" >penPath(anchors, closed)   -&gt;   BLPath of move_to + cubic_to(in/out handles)   -&gt;   addDrawn(...)  (one undo step: "Draw with Pencil")</text>
<text x="480" y="369" class="s c" >Paintbrush runs the same code, then stores the active BrushDef in the stroke options.</text>
</svg>
