<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Clipping masks">
<title>Clipping masks</title>
<desc>A clipping group draws its members into a layer and multiplies it by the mask's coverage.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450" y="26" class="h c" >Clipping mask = group with GroupProps::clip</text>
<defs><clipPath id="m"><circle cx="460" cy="150" r="52"/></clipPath></defs>
<rect x="40" y="60" width="150" height="100" rx="0" class="box" />
<rect x="46" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<rect x="70" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<rect x="94" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<rect x="118" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<rect x="142" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<rect x="166" y="60" width="12" height="100" fill="#1e6fe0" opacity="0.7"/>
<text x="115" y="180" class="s c" >members (below the mask)</text>
<line x1="200" y1="110" x2="250" y2="110" class="acc" marker-end="url(#arrowAcc)"/>
<rect x="250" y="70" width="130" height="80" rx="0" class="soft" />
<text x="315" y="105" class="s c" >layer (device</text>
<text x="315" y="118" class="s c" >resolution)</text>
<circle cx="460" cy="150" r="52" class="box" stroke-dasharray="4 3"/>
<text x="460" y="225" class="s c" >mask = topmost member's outline</text>
<text x="460" y="238" class="s c" >(filled non-zero -&gt; coverage image)</text>
<line x1="390" y1="110" x2="420" y2="130" class="acc" marker-end="url(#arrowAcc)"/>
<g clip-path="url(#m)"><rect x="400" y="98" width="120" height="104" fill="#e8f0fc" opacity="0"/>
<rect x="412" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
<rect x="432" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
<rect x="452" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
<rect x="472" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
<rect x="492" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
<rect x="512" y="98" width="12" height="104" fill="#1e6fe0" opacity="0.7"/>
</g>
<line x1="525" y1="150" x2="590" y2="150" class="acc" marker-end="url(#arrowAcc)"/>
<text x="660" y="128" class="s c" >result = layer x coverage, then</text>
<text x="660" y="142" class="s c" >composited with the group's opacity</text>
<text x="660" y="156" class="s c" >and blend mode (paintClipped)</text>
<rect x="20" y="270" width="860" height="56" rx="6" class="panel" />
<text x="34" y="292" class="s" >hitTest ignores the parts a mask cuts away; selectionBounds is the mask's bounds intersected; the mask object itself paints nothing.</text>
<text x="34" y="308" class="s" >Saved as &lt;g data-clip="true"&gt; and the skb CLIP chunk. SVG import of clip-path builds the same group (content + one mask object of the clip shapes).</text>
</svg>
