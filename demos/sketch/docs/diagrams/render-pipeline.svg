<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-label="Rendering pipeline">
<title>Rendering pipeline</title>
<desc>How a document is painted into a BLContext.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="490" y="26" class="h c" >SketchDocument::paint(ctx)</text>
<rect x="380" y="44" width="220" height="44" rx="6" class="soft" />
<text x="490" y="63" class="t b c" >paintRange(begin, end, depth)</text>
<text x="490" y="78" class="s c" >walks objects_ in stacking order</text>
<rect x="60" y="130" width="250" height="54" rx="6" class="box" />
<text x="185" y="154" class="t b c" >object not in a group at this depth</text>
<text x="185" y="169" class="s c" >-&gt; object.paint(ctx)</text>
<rect x="380" y="130" width="250" height="54" rx="6" class="box" />
<text x="505" y="154" class="t b c" >a run of members of one group</text>
<text x="505" y="169" class="s c" >same groups_[depth] (they are adjacent)</text>
<rect x="700" y="130" width="240" height="54" rx="6" class="box" />
<text x="820" y="154" class="t b c" >group has opacity / blend / clip</text>
<text x="820" y="169" class="s c" >-&gt; draw members into an offscreen layer</text>
<line x1="490" y1="88" x2="185" y2="130" class="line" marker-end="url(#arrow)"/>
<line x1="490" y1="88" x2="505" y2="130" class="line" marker-end="url(#arrow)"/>
<line x1="630" y1="157" x2="700" y2="157" class="line" marker-end="url(#arrow)"/>
<text x="660" y="150" class="s c" >else recurse</text>
<rect x="700" y="210" width="240" height="54" rx="6" class="box" />
<text x="820" y="234" class="t b c" >layer composited with opacity + mode</text>
<text x="820" y="249" class="s c" >clip group: layer x coverage of the mask</text>
<line x1="820" y1="184" x2="820" y2="210" class="line" marker-end="url(#arrow)"/>
<text x="490" y="246" class="h c" >SketchObject::paint(ctx)</text>
<line x1="185" y1="184" x2="185" y2="270" class="line" marker-end="url(#arrow)"/>
<rect x="60" y="270" width="250" height="54" rx="6" class="box" />
<text x="185" y="294" class="t b c" >pixel effects present?</text>
<text x="185" y="309" class="s c" >blur / shadow / glow / inner shadow</text>
<rect x="380" y="270" width="250" height="54" rx="6" class="box" />
<text x="505" y="294" class="t b c" >opacity &lt; 1 or blend != normal?</text>
<text x="505" y="309" class="s c" >paintIsolated(layer)</text>
<rect x="700" y="270" width="240" height="54" rx="6" class="box" />
<text x="820" y="294" class="t b c" >otherwise paintItems(ctx)</text>
<text x="820" y="309" class="s c" >straight into the context</text>
<line x1="310" y1="297" x2="380" y2="297" class="line" marker-end="url(#arrow)"/>
<line x1="630" y1="297" x2="700" y2="297" class="line" marker-end="url(#arrow)"/>
<text x="345" y="290" class="s c" >no</text>
<text x="665" y="290" class="s c" >no</text>
<rect x="60" y="360" width="250" height="54" rx="6" class="box" />
<text x="185" y="384" class="t b c" >paintWithEffects</text>
<text x="185" y="399" class="s c" >items into a device-resolution layer; each pixel effect post-processes it</text>
<line x1="185" y1="324" x2="185" y2="360" class="line" marker-end="url(#arrow)"/>
<text x="205" y="346" class="s" >yes</text>
<text x="40" y="452" class="h" >for every visible item, bottom to top: drawItem(index)</text>
<rect x="60" y="470" width="160" height="70" rx="6" class="box" />
<text x="140" y="496" class="t b c" >Fill</text>
<text x="140" y="511" class="s c" >setPaintStyle: solid, gradient,</text>
<text x="140" y="523" class="s c" >pattern (BLPattern tile)</text>
<rect x="240" y="470" width="200" height="70" rx="6" class="box" />
<text x="340" y="496" class="t b c" >Stroke</text>
<text x="340" y="511" class="s c" >plain / dashed / width outline /</text>
<text x="340" y="523" class="s c" >gradient along path / brush</text>
<rect x="460" y="470" width="150" height="70" rx="6" class="box" />
<text x="535" y="496" class="t b c" >Symbol / Image</text>
<text x="535" y="511" class="s c" >artwork or pixels at the</text>
<text x="535" y="523" class="s c" >first fill's place</text>
<rect x="630" y="470" width="150" height="70" rx="6" class="box" />
<text x="705" y="496" class="t b c" >Geometry effects</text>
<text x="705" y="511" class="s c" >round corners, offset,</text>
<text x="705" y="523" class="s c" >roughen -&gt; `shown` path</text>
<rect x="800" y="470" width="140" height="70" rx="6" class="box" />
<text x="870" y="496" class="t b c" >Text</text>
<text x="870" y="511" class="s c" >just a path: the</text>
<text x="870" y="523" class="s c" >glyph outlines</text>
<line x1="490" y1="414" x2="140" y2="470" class="line" marker-end="url(#arrow)"/>
<line x1="490" y1="414" x2="340" y2="470" class="line" marker-end="url(#arrow)"/>
<line x1="490" y1="414" x2="535" y2="470" class="line" marker-end="url(#arrow)"/>
<line x1="490" y1="414" x2="705" y2="470" class="line" marker-end="url(#arrow)"/>
<line x1="490" y1="414" x2="870" y2="470" class="line" marker-end="url(#arrow)"/>
<text x="490" y="585" class="s c" >Everything is painted from the object's BLPath in document units; the context transform (zoom, pan) is applied by CanvasView.</text>
<text x="490" y="603" class="s c" >Offscreen layers are made at the context's device resolution (makeLayer), so effects stay sharp when zoomed.</text>
</svg>
