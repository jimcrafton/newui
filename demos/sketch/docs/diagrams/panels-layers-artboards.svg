<text x="446" y="74" class="t" >Layer row: eye (show / hide), lock, triangle (open / close), name, selection square (click: move the selection into the layer)</text>
<circle cx="430" cy="104" r="9.5" fill="#d4380d"/><text x="430" y="108" class="c b" style="fill:#fff;font-size:11px">2</text>
<text x="446" y="108" class="t" >Object row: the swatch is the object's fill; a tinted row is selected</text>
<circle cx="430" cy="138" r="9.5" fill="#d4380d"/><text x="430" y="142" class="c b" style="fill:#fff;font-size:11px">3</text>
<text x="446" y="142" class="t" >Group row: closed until opened; eye and lock act on every member</text>
<circle cx="430" cy="172" r="9.5" fill="#d4380d"/><text x="430" y="176" class="c b" style="fill:#fff;font-size:11px">4</text>
<text x="446" y="176" class="t" >The colored strip is the layer's color: it also colors the selection frame of its objects</text>
<text x="420" y="240" class="t b" >Working in the tree</text>
<text x="420" y="262" class="s" >- Click a layer: it becomes the active one (new shapes go there); Ctrl-click also selects its objects.</text>
<text x="420" y="282" class="s" >- Click an object or group row to select it (Shift adds, Ctrl toggles); the name field then renames it.</text>
<text x="420" y="302" class="s" >- Drag a row onto a layer to move it there, or just above / below another row to reorder it.</text>
<text x="420" y="322" class="s" >- Drag a layer onto another layer's middle to make it a sublayer, onto an edge to reorder.</text>
<text x="420" y="342" class="s" >- The mouse wheel scrolls a long tree; the Layer menu has Duplicate, Merge, Flatten and more.</text>
<text x="420" y="362" class="s" >- Artboards panel: pick one to make it active; Align, Image Trace and export use the active one.</text>
</svg>
