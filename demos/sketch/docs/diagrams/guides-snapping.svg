<text x="636" y="74" class="t" >Drag from a ruler to make a guide; drag it to move it; drag it back onto the ruler to remove it</text>
<circle cx="620" cy="134" r="9.5" fill="#d4380d"/><text x="620" y="138" class="c b" style="fill:#fff;font-size:11px">2</text>
<text x="636" y="138" class="t" >Smart Guides: a magenta line shows what the dragged edge or center caught (other objects' edges and centers)</text>
<circle cx="620" cy="198" r="9.5" fill="#d4380d"/><text x="620" y="202" class="c b" style="fill:#fff;font-size:11px">3</text>
<text x="636" y="202" class="t" >The grid: View &gt; Show Grid; Snap to Grid pulls drawing and moving onto it (toolbar button)</text>
<circle cx="620" cy="262" r="9.5" fill="#d4380d"/><text x="620" y="266" class="c b" style="fill:#fff;font-size:11px">4</text>
<text x="636" y="266" class="t" >Rulers show points from the document origin; View &gt; Show Rulers</text>
<text x="610" y="340" class="s" >View menu: Show / Lock / Clear Guides, Smart Guides, Snap to Grid.</text>
<text x="610" y="356" class="s" >Snapping catches within about 6 screen pixels; Shift while drawing a</text>
<text x="610" y="370" class="s" >line or rotating constrains angles; hold Alt while resizing for the center.</text>
