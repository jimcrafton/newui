<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-label="Clipping mask examples">
<title>Clipping mask examples</title>
<desc>Four uses: a picture in a shape, a picture or pattern seen through letters, trimming overflow, and rounding a block's corners.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker><linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9ee"/><stop offset="1" stop-color="#cfe9fb"/></linearGradient><clipPath id="cA"><circle cx="330" cy="125" r="56"/></clipPath><linearGradient id="skyA2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9ee"/><stop offset="1" stop-color="#cfe9fb"/></linearGradient><clipPath id="box5"><rect x="520" y="62" width="390" height="58"/></clipPath><clipPath id="cB"><text x="715" y="205" style="font-family:Arial Black,Arial,sans-serif;font-weight:900;font-size:54px;text-anchor:middle;">SKETCH</text></clipPath><clipPath id="box7"><rect x="520" y="155" width="390" height="70"/></clipPath><clipPath id="cCv1"><rect x="40" y="365" width="190" height="150"/></clipPath><clipPath id="cCv2"><rect x="265" y="365" width="190" height="150"/></clipPath><clipPath id="cC"><rect x="337" y="390" width="120" height="95"/></clipPath><clipPath id="cD"><rect x="530" y="385" width="170" height="110" rx="22"/></clipPath><linearGradient id="gD" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e6fe0"/><stop offset="1" stop-color="#8a3fd1"/></linearGradient></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="450" height="280" rx="8" class="panel" />
<text x="34" y="46" class="h" >A  Crop a picture to a shape</text>
<text x="34" y="258" class="s" >Crop a photo to a circle, a badge or any outline. The photo is</text>
<text x="34" y="271" class="s" >not cut: release the mask to get it all back.</text>
<rect x="490" y="20" width="450" height="280" rx="8" class="panel" />
<text x="504" y="46" class="h" >B  Text as a window</text>
<text x="504" y="258" class="s" >Make the words the mask: the stripes (or a photo, a gradient)</text>
<text x="504" y="271" class="s" >show only through the letters.</text>
<rect x="20" y="330" width="450" height="280" rx="8" class="panel" />
<text x="34" y="356" class="h" >C  Trim what spills over</text>
<text x="34" y="568" class="s" >A pattern or drawing that runs past the edge of a card, banner</text>
<text x="34" y="581" class="s" >or artboard: put a rectangle on top and mask.</text>
<rect x="490" y="330" width="450" height="280" rx="8" class="panel" />
<text x="504" y="356" class="h" >D  Rounded or shaped corners</text>
<text x="504" y="568" class="s" >A gradient header, a bar chart or a swatch row takes on the</text>
<text x="504" y="581" class="s" >corners of the shape that masks it.</text>
<g><rect x="40" y="70" width="150" height="110" fill="url(#skyA)"/><circle cx="151" cy="99.7" r="13.2" fill="#ffd45e"/><path d="M40 149.2 Q70 116.2 107.5 144.8 T167.5 138.2 L190 180 L40 180 Z" fill="#3f8f5a"/><path d="M85 180 Q122.5 142.6 160 162.4 T190 158 L190 180 L85 180 Z" fill="#2b6b43"/></g>
<text x="115" y="198" class="s c" >before</text>
<line x1="200" y1="125" x2="245" y2="125" class="acc" marker-end="url(#arrowAcc)"/>
<text x="222" y="112" class="s c" >mask</text>
<g clip-path="url(#cA)"><rect x="255" y="65" width="150" height="110" fill="url(#skyA2)"/><circle cx="366" cy="94.7" r="13.2" fill="#ffd45e"/><path d="M255 144.2 Q285 111.2 322.5 139.8 T382.5 133.2 L405 175 L255 175 Z" fill="#3f8f5a"/><path d="M300 175 Q337.5 137.6 375 157.4 T405 153 L405 175 L300 175 Z" fill="#2b6b43"/></g>
<circle cx="330" cy="125" r="56" fill="none" stroke="#222222" stroke-width="3"/>
<text x="330" y="198" class="s c" >after (circle on top, then Make)</text>
