<rect x="20" y="290" width="960" height="250" rx="6" class="soft" />
<text x="34" y="312" class="t b" >Good to know</text>
<text x="34" y="336" class="s" >- The text keeps its words: after Make Text on Path you can still change the font, size, tracking or retype it with the Text tool (the caret is drawn on the path).</text>
<text x="34" y="358" class="s" >- Make copies the paths into the text: the original paths stay where they are; delete or restyle them as you like. Moving the text moves its copy of the path with it.</text>
<text x="34" y="380" class="s" >- Release Text from Path makes it plain text again, where its start is now. Undo takes it off in one step.</text>
<text x="34" y="402" class="s" >- Text is a shape: give it a fill, stroke, gradient, effects, or put it in a clipping mask. Pathfinder works on text outlines too.</text>
<text x="34" y="424" class="s" >- Clicking inside warped text puts the typing caret at the end of the text.</text>
<text x="34" y="446" class="s" >- The Text panel captions Size, Track and Lead scrub: drag them sideways.</text>
</svg>
