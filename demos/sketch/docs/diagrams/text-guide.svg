<rect x="670" y="44" width="310" height="230" rx="6" class="panel" />
<text x="680" y="62" class="t b" >Text between two paths</text>
<text x="680" y="238" class="s" >select the text and TWO paths, then Make Text</text>
<text x="680" y="251" class="s" >Between Paths: the text is stretched like an</text>
<text x="680" y="264" class="s" >envelope between them (the higher one is the top).</text>
<path d="M690 110 Q820 80 960 120" class="thin" stroke="#aaa"/>
<path d="M690 210 Q820 250 960 190" class="thin" stroke="#aaa"/>
<text transform="translate(706.88 189.73) scale(1 2.79)" text-anchor="middle" style="font-size:40px;font-weight:700;fill:#2f7d4f">E</text>
