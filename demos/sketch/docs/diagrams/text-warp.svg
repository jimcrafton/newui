<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Text on a path and text between two paths">
<title>Text on a path and text between two paths</title>
<desc>Mappings from the flat text space onto the paths.</desc>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="480" y="26" class="h c" >TextWarper: from the flat text onto paths</text>
<rect x="20" y="44" width="260" height="190" rx="6" class="panel" />
<text x="150" y="64" class="t b c" >flat text space</text>
<line x1="50" y1="150" x2="250" y2="150" class="thin" />
<text x="50" y="150" style="font-size:44px;font-weight:700;fill:#1e6fe0" opacity="0.5">Text</text>
<line x1="50" y1="150" x2="50" y2="108" class="thin" />
<text x="54" y="164" class="s" >x runs along the first baseline</text>
<text x="54" y="178" class="s" >y is down; capitals reach to about -0.78 * size</text>
<text x="54" y="192" class="s" >frame: x0..x1 (ink), yTop = -0.78 size,</text>
<text x="54" y="206" class="s" >yBottom = last baseline + 0.22 size</text>
<rect x="300" y="44" width="320" height="190" rx="6" class="panel" />
<text x="460" y="64" class="t b c" >OnPath</text>
