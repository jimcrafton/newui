<line x1="390" y1="138.04" x2="376.4" y2="115.89" class="acc" />
<circle cx="390" cy="138.04" r="2.4" fill="#222222"/>
<line x1="439" y1="115.39" x2="431.73" y2="90.43" class="acc" />
<circle cx="439" cy="115.39" r="2.4" fill="#222222"/>
<line x1="488" y1="110.63" x2="490.62" y2="84.76" class="acc" />
<circle cx="488" cy="110.63" r="2.4" fill="#222222"/>
<line x1="537" y1="124.91" x2="548.05" y2="101.37" class="acc" />
<circle cx="537" cy="124.91" r="2.4" fill="#222222"/>
<text x="314" y="222" class="s" >p = P(start + x) + N * (-y);  N = (dy, -dx)</text>
<text x="314" y="84" class="s" >start = start% * length;  flip reverses the path</text>
<rect x="640" y="44" width="300" height="190" rx="6" class="panel" />
<text x="790" y="64" class="t b c" >Between</text>
