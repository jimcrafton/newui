<text x="652" y="215" class="s" >p = lerp(T(u), B(u), v)</text>
<text x="652" y="228" class="s" >u = (x-x0)/(x1-x0)  v = (y-yTop)/(yBottom-yTop)</text>
<rect x="20" y="256" width="920" height="190" rx="6" class="soft" />
<text x="34" y="278" class="t b" >SketchObject::rebuildText()</text>
<rect x="34" y="292" width="160" height="40" rx="6" class="box" />
<text x="114" y="316" class="t b c" >textOutline()</text>
<rect x="214" y="292" width="160" height="40" rx="6" class="box" />
<text x="294" y="316" class="t b c" >flatten + cut edges</text>
<line x1="194" y1="312" x2="214" y2="312" class="line" marker-end="url(#arrow)"/>
<rect x="394" y="292" width="160" height="40" rx="6" class="box" />
<text x="474" y="316" class="t b c" >TextWarper.map(x, y)</text>
<line x1="374" y1="312" x2="394" y2="312" class="line" marker-end="url(#arrow)"/>
<rect x="574" y="292" width="160" height="40" rx="6" class="box" />
<text x="654" y="316" class="t b c" >x textMatrix_</text>
<line x1="554" y1="312" x2="574" y2="312" class="line" marker-end="url(#arrow)"/>
<rect x="754" y="292" width="160" height="40" rx="6" class="box" />
<text x="834" y="316" class="t b c" >path_</text>
<line x1="734" y1="312" x2="754" y2="312" class="line" marker-end="url(#arrow)"/>
<text x="34" y="356" class="s" >- the warp paths are COPIES in the text's own flat space (the space textMatrix_ places on the page): moving, scaling or turning the text moves them</text>
<text x="34" y="372" class="s" >  with it, and undo of a move (path + textMatrix snapshot) needs nothing more. Making a warp sets textMatrix_ to identity (paths are in page coordinates).</text>
<text x="34" y="388" class="s" >- Between: both paths are measured by arc length; the higher one is the top; paths are turned to run left to right and the same way.</text>
<text x="34" y="404" class="s" >- mapTextPoint(x, y) = textMatrix_ * warp(x, y): where the editing caret is drawn. Clicking in warped text puts the caret at the end.</text>
<text x="34" y="420" class="s" >- Saved as data-text-warp + data-warp-a / data-warp-b (SVG) and object flag 128 (skb).</text>
</svg>
