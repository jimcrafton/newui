<ellipse cx="597" cy="130" rx="62" ry="42" fill="none" stroke="#1e6fe0" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="597" y="205" class="s c" >(faint) outline of the mask</text>
<g clip-path="url(#box7)"><g><rect x="747" y="70" width="14" height="120" fill="#e8472b"/><rect x="761" y="70" width="14" height="120" fill="#f2b824"/><rect x="775" y="70" width="14" height="120" fill="#1e6fe0"/><rect x="789" y="70" width="14" height="120" fill="#2f7d4f"/><rect x="803" y="70" width="14" height="120" fill="#e8472b"/><rect x="817" y="70" width="14" height="120" fill="#f2b824"/><rect x="831" y="70" width="14" height="120" fill="#1e6fe0"/><rect x="845" y="70" width="14" height="120" fill="#2f7d4f"/><rect x="859" y="70" width="14" height="120" fill="#e8472b"/><rect x="873" y="70" width="14" height="120" fill="#f2b824"/><rect x="887" y="70" width="14" height="120" fill="#1e6fe0"/><rect x="901" y="70" width="14" height="120" fill="#2f7d4f"/><rect x="915" y="70" width="14" height="120" fill="#e8472b"/><rect x="929" y="70" width="14" height="120" fill="#f2b824"/></g></g>
