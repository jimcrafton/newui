<ellipse cx="362" cy="130" rx="62" ry="42" fill="#fbe3df" fill-opacity="0.85" stroke="#d4380d" stroke-width="2"/>
<rect x="275" y="68" width="174" height="124" fill="none" stroke="#1e6fe0" stroke-width="1.2"/>
<rect x="272" y="65" width="6" height="6" fill="#fff" stroke="#1e6fe0" stroke-width="1.2"/>
