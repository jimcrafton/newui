<text x="770" y="232" class="s" >StrokeOptions::brush: nib hull,</text>
<text x="770" y="245" class="s" >bent artwork or scatter</text>
<rect x="20" y="310" width="920" height="140" rx="6" class="soft" />
<text x="34" y="332" class="t b" >Which branch runs (paintStrokeItem, sketchobject.cpp):</text>
<text x="34" y="352" class="s" >1. StrokeOptions::brush set      -&gt; paintBrushStroke  (dashes, caps, widths and "along path" are ignored)</text>
<text x="34" y="369" class="s" >2. width profile (WidthPoint t, left, right) -&gt; filled outline from widthOutline, caps by StrokeCap</text>
<text x="34" y="386" class="s" >3. gradient paint with alongStroke -&gt; strokeAlongPath; opaque strokes get a disc at each vertex so bends stay filled</text>
<text x="34" y="403" class="s" >4. otherwise Blend2D strokes the (possibly dashed) path; hit testing uses the same stroker at width + tolerance</text>
</svg>
