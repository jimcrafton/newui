<text x="650" y="232" class="s" >copies every  width * weight * spacing%  of arc</text>
<text x="650" y="245" class="s" >length; each: translate to the artwork centre,</text>
<text x="650" y="258" class="s" >scale (size variation), turn (follow the path +</text>
<text x="650" y="271" class="s" >random turn), move across the path (stray)</text>
<text x="650" y="284" class="s" >random values: a hash of the copy index</text>
<rect x="20" y="320" width="920" height="60" rx="6" class="soft" />
<text x="34" y="343" class="s" >A BrushDef is immutable and shared (shared_ptr in StrokeOptions); editing a brush swaps in a new one and rebinds every stroke and graphic style.</text>
<text x="34" y="360" class="s" >bounds() and hitTest() use BrushDef::reach(weight); the artwork parts are built once from the definition's SketchDocument (parts()).</text>
</svg>
