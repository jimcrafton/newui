<text x="30" y="232" class="s" >nib = 16-gon ellipse: major = stroke weight / 2,</text>
<text x="30" y="245" class="s" >minor = major * roundness, turned by -angle</text>
<text x="30" y="258" class="s" >each path segment: convex hull of the nib at</text>
<text x="30" y="271" class="s" >both ends (monotone chain, one winding);</text>
<text x="30" y="284" class="s" >all hulls filled non-zero = their union</text>
