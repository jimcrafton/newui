<text x="340" y="232" class="s" >u = (x - box.x0) / width  -&gt;  arc length s = u * L</text>
<text x="340" y="245" class="s" >point = P(s) + N(s) * (centre y - y) * weight</text>
<text x="340" y="258" class="s" >outlines are flattened and long edges cut so</text>
<text x="340" y="271" class="s" >they bend; weight 1 = the artwork's own size</text>
<text x="340" y="284" class="s" >(bendAlong, per subpath)</text>
