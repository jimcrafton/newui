<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Gradient and Width tools">
<title>Gradient and Width tools</title>
<defs><style>
text{font-family:'Segoe UI',Arial,Helvetica,sans-serif;font-size:12px;fill:#222222}
.t{font-size:12px}.s{font-size:10.5px;fill:#666666}.b{font-weight:600}.h{font-size:15px;font-weight:700}.m{font-family:Consolas,'Courier New',monospace;font-size:11px;white-space:pre}
.c{text-anchor:middle}.e{text-anchor:end}
.box{fill:#fff;stroke:#9a9a9a;stroke-width:1.2}.soft{fill:#e8f0fc;stroke:#1e6fe0;stroke-width:1.2}.panel{fill:#f4f4f4;stroke:#9a9a9a;stroke-width:1}
.line{stroke:#222222;stroke-width:1.4;fill:none}.thin{stroke:#9a9a9a;stroke-width:1;fill:none}.acc{stroke:#1e6fe0;stroke-width:1.8;fill:none}
.dash{stroke-dasharray:5 4}.field{fill:#fff;stroke:#b5b5b5;stroke-width:1}
</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222222"/></marker><marker id="arrowAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e6fe0"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500" y="24" class="h c" >Gradient tool and Width tool</text>
<rect x="20" y="44" width="470" height="370" rx="6" class="panel" />
<text x="30" y="62" class="t b" >Gradient tool</text>
<text x="30" y="378" class="s" >drag across the object to lay a gradient axis (Shift = 45 degrees)</text>
<text x="30" y="391" class="s" >drag the circle / square ends or the diamond stops; click the axis to add a stop;</text>
<text x="30" y="404" class="s" >Alt-click a stop to delete it. With the Color panel on Stroke, it edits the stroke.</text>
<defs><linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="90" y1="120" x2="400" y2="270"><stop offset="0" stop-color="#f2b824"/><stop offset=".55" stop-color="#e8452c"/><stop offset="1" stop-color="#6a4fc7"/></linearGradient></defs>
<rect x="70" y="90" width="370" height="200" rx="14" fill="url(#gg)" stroke="#1b3a6b" stroke-width="2"/>
<line x1="90" y1="120" x2="400" y2="270" class="acc" />
<circle cx="90" cy="120" r="6" class="box" />
<rect x="394" y="264" width="12" height="12" rx="0" class="box" />
<path d="M260.5 194.5 l7 8 l-7 8 l-7 -8z" fill="#fff" stroke="#222222" stroke-width="1.6"/>
<rect x="510" y="44" width="470" height="370" rx="6" class="panel" />
<text x="520" y="62" class="t b" >Width tool</text>
<text x="520" y="378" class="s" >drag a path to add a width point; drag its handles to widen the</text>
<text x="520" y="391" class="s" >stroke, the diamond to slide it; Alt-click a point to delete it.</text>
<text x="520" y="404" class="s" >Stroke panel &gt; Profile: uniform, taper, bulge presets.</text>
